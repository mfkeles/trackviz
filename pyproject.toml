[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trackviz"
version = "0.1.1"
description = "Scrubbable video viewer for object detection/tracking predictions."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name="Mehmet Keles and AI"}]
dependencies = [
  "numpy>=1.23",
  "opencv-python>=4.8",
  "PySide6>=6.5",
  "matplotlib>=3.6",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# `trackviz train` — ultralytics pulls in PyTorch. On CUDA machines install the
# CUDA build of torch first (https://pytorch.org/get-started/locally/).
train = ["ultralytics>=8.3"]

[project.scripts]
trackviz = "trackviz.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["trackviz"]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]
